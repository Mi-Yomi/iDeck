      - .work/win32u-control-artifacts/freetype-ios-archive.zip
      - .work/win32u-control-artifacts/win32u-ios-archive.zip
# PROPOSAL ONLY. No triggers, retries, caches, publication, credentials or signing.
# Exact original successful Wine producer ZIP and reviewed lock are now included.
# Template PIN_PENDING values remain rejected; only the reviewed actual lock can run.
# Input ci/inputs/wine-headers.zip must already be in the approved private repo;
# this workflow never downloads arbitrary artifacts or installs additional tools.
