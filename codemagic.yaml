workflows:
  ideck-main-apple-source-check:
    name: iDeck real-source Apple compiler check (no runtime link)
    instance_type: mac_mini_m2
    max_build_duration: 25
    inputs:
      expected_source_commit:
        description: Exact audited iDeck source commit recorded in source-manifest.json
        type: string
      free_quota_verified:
        description: Personal free macOS allowance and disabled paid subscription
          verified before this manual run
        type: string
        default: 'false'
      private_source_verified:
        description: This approved private Mi-Yomi/iDeck source package is the selected
          repository
        type: string
        default: 'false'
    environment:
      xcode: '26.6'
      vars:
        EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        FREE_QUOTA_VERIFIED: ${{ inputs.free_quota_verified }}
        PRIVATE_SOURCE_VERIFIED: ${{ inputs.private_source_verified }}
        GIT_TERMINAL_PROMPT: '0'
    scripts:
    - name: Verify approved source and reconstruct exact audited tree
      script: "set -euo pipefail\ntest \"$(uname -s)\" = Darwin\ntest \"${FREE_QUOTA_VERIFIED:-false}\"\
        \ = true\ntest \"${PRIVATE_SOURCE_VERIFIED:-false}\" = true\npython3 - <<'PY'\n\
        import json, os, re\nfrom pathlib import Path\nexpected = os.environ.get(\"\
        EXPECTED_SOURCE_COMMIT\", \"\")\nif not re.fullmatch(r\"[0-9a-f]{40}\", expected):\n\
        \    raise SystemExit(\"Expected source must be the full audited commit SHA\"\
        )\nmanifest = json.loads(Path(\"source-manifest.json\").read_text())\nif manifest[\"\
        source_commit\"] != expected:\n    raise SystemExit(\"Source package does\
        \ not match the approved commit\")\nPY\npython3 ci/reconstruct_source.py\n"
    - name: Compile actual iDeck packages and typecheck main app with Apple SDK
      script: "set -euo pipefail\nSOURCE_TREE=\"$(python3 -c 'import json; print(json.load(open(\"\
        source-manifest.json\"))[\"source_tree\"])')\"\ncd .work/source\nresult=0\n\
        python3 tools/apple_source_check.py --expected-tree \"$SOURCE_TREE\" --seconds\
        \ 1020 || result=$?\npython3 - <<'PYREPORT'\nimport json\nfrom pathlib import\
        \ Path\npaths = list(Path(\".work/ideck/apple-source-check\").glob(\"run-*/result.json\"\
        ))\nif len(paths) != 1:\n    raise SystemExit(\"Exactly one compiler result\
        \ report was expected\")\nreport = json.loads(paths[0].read_text())\nkeys\
        \ = (\"result\", \"failure\", \"scope\", \"expected_tree\", \"checkout_head\"\
        , \"xcode\",\n        \"sdk_version\", \"swift\", \"target\", \"dev_source_count\"\
        , \"release_source_count\",\n        \"runtime_linked\", \"ipa_created\",\
        \ \"device_tested\")\nsummary = {key: report[key] for key in keys if key in\
        \ report}\nsummary[\"dependency_modules\"] = sorted(report.get(\"dependency_modules\"\
        , {}))\nsummary[\"steps\"] = [{key: step[key] for key in (\"label\", \"exit_code\"\
        , \"elapsed_seconds\", \"timed_out\") if key in step}\n                  \
        \  for step in report.get(\"steps\", [])]\nprint(\"APPLE_SOURCE_CHECK_RESULT=\"\
        \ + json.dumps(summary, sort_keys=True))\nPYREPORT\nexit \"$result\"\n"
