# Manual proposal only: no triggers, cache, retries, publishing, credentials or signing.
# Exact public tracked GMP 6.3.0 / Nettle 3.10.1 / GnuTLS 3.8.9 release sources.
# Existing Apple tools, Python 3.12.7, make 3.81, m4 and pkg-config; no installation.
# 23-minute aggregate process-group deadline; provider hard limit 25 minutes; jobs 4.
# Prefix-only product is preserved if the subsequent target-link proof fails.
# Target probe has no ad-hoc signature and is never executed. No Wine overlay is emitted.
# Prefix, link and eventual runtime/device tests are distinct evidence gates.
