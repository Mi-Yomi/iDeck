Section "Device"
    Identifier "iDeck virtio KMS"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
    Option "SWcursor" "true"
EndSection
Section "Screen"
    Identifier "iDeck Screen"
    Device "iDeck virtio KMS"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "800x600"
    EndSubSection
EndSection
Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection
